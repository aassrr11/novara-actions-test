name: ANAN P0 surgical patch

on:
  push:
    paths:
      - '.github/workflows/anan-p0-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      INDEX_URL: "https://shopify-shop-assets.storage.googleapis.com/s/files/1/d/6b56/0705/6320/1137/t/3/assets/anan-p0-index.txt?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=merchant-assets%40shopify-tiers.iam.gserviceaccount.com%2F20261011%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20261011T143906Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-"
      PRODUCT_URL: "https://shopify-shop-assets.storage.googleapis.com/s/files/1/d/f3c4/0705/6320/1137/t/3/assets/anan-p0-product.txt?X-Goog-Algorithm=GOOG4-RSA-SHA256&X-Goog-Credential=merchant-assets%40shopify-tiers.iam.gserviceaccount.com%2F20261011%2Fauto%2Fstorage%2Fgoog4_request&X-Goog-Date=20261011T143906Z&X-Goog-Expires=300&X-Goog-SignedHeaders=host&X-Goog-"
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact Shopify rollback assets
        run: |
          mkdir -p out
          curl -fL "$INDEX_URL" -o /tmp/index.json
          curl -fL "$PRODUCT_URL" -o /tmp/product.json
          echo "8b588e2a53f955911d31fba4b05ef8c0  /tmp/index.json" | md5sum -c -
          echo "fe03b1dec11f844a7842c64ec0ef621b  /tmp/product.json" | md5sum -c -
      - name: Apply guarded surgical replacements
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, re

          def md5(b): return hashlib.md5(b).hexdigest()
          def once(text, old, new, label):
              c = text.count(old)
              if c != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {c}")
              return text.replace(old, new, 1)
          def validate_shopify_json(text):
              clean = re.sub(r'^\s*/\*.*?\*/\s*', '', text, count=1, flags=re.S)
              json.loads(clean)

          ib = Path('/tmp/index.json').read_bytes()
          pb = Path('/tmp/product.json').read_bytes()
          if md5(ib) != '8b588e2a53f955911d31fba4b05ef8c0': raise SystemExit('INDEX baseline mismatch')
          if md5(pb) != 'fe03b1dec11f844a7842c64ec0ef621b': raise SystemExit('PRODUCT baseline mismatch')

          it = ib.decode('utf-8')
          pt = pb.decode('utf-8')

          it = once(it, '"discount_percentage": 20', '"discount_percentage": 15', 'INDEX discount')

          replacements = [
            ('"heading": "How long does shipping take?"', '"heading": "ما مدة التوصيل؟"', 'shipping heading'),
            ('<p>Orders are processed within 1–2 business days. Standard shipping typically takes 3–5 business days within the continental US, while international delivery ranges from 7–14 business days depending on destination.</p>', '<p>تظهر طرق التوصيل المتاحة وتكلفتها والتقديرات الزمنية ذات الصلة أثناء مسار الشراء أو في تأكيد الطلب، بحسب الوجهة والخدمة المتاحة.</p>', 'shipping body'),
            ('"heading": "What is your return policy?"', '"heading": "ما سياسة الاستبدال والاسترجاع؟"', 'return heading'),
            ('<p>We offer a 30-day satisfaction guarantee. If you are not completely satisfied with your purchase, you can return unopened or gently used items within 30 days of delivery for a full refund or exchange.</p>', '<p>يمكن طلب إرجاع أو استبدال المنتجات المؤهلة خلال 14 يومًا تقويميًا من تاريخ الاستلام، وفق شروط سياسة الاستبدال والاسترجاع المعتمدة.</p>', 'return body'),
            ('<p>Free standard delivery on orders over $100</p>', '<p>تظهر خيارات التوصيل المتاحة وتكلفتها عند إتمام الطلب، بحسب الوجهة والخدمة المتاحة.</p>', 'free shipping body'),
          ]
          for old, new, label in replacements:
              pt = once(pt, old, new, label)

          validate_shopify_json(it)
          validate_shopify_json(pt)
          Path('out/anan-p0-index.json').write_bytes(it.encode('utf-8'))
          Path('out/anan-p0-product.json').write_bytes(pt.encode('utf-8'))
          Path('out/checksums.txt').write_text(f"index={md5(it.encode('utf-8'))}\nproduct={md5(pt.encode('utf-8'))}\n", encoding='utf-8')
      - name: Commit patched outputs
        run: |
          git config user.name "ANAN P0 QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add out/anan-p0-index.json out/anan-p0-product.json out/checksums.txt
          git commit -m "Generate ANAN P0 guarded theme patches"
          git push
